<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reprise</title>
<style>
  :root {
    --ink: #1c1b1f;
    --soft: #56545c;
    --paper: #fbfaf8;
    --glass: rgba(255,255,255,.55);
    --rim: rgba(255,255,255,.75);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    background-image:
      radial-gradient(50rem 30rem at 12% -6%, rgba(255,214,196,.55), transparent 60%),
      radial-gradient(46rem 30rem at 92% 4%, rgba(197,205,255,.55), transparent 60%),
      radial-gradient(40rem 26rem at 60% 22%, rgba(190,235,222,.40), transparent 62%);
    background-repeat: no-repeat;
    color: var(--ink);
    font: 17px/1.65 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 24rem; padding: 24px; text-align: center; }
  h1 { font-size: 1.8rem; letter-spacing: -.02em; margin: 0 0 1.6rem; }
  .links { display: flex; gap: 12px; justify-content: center; }
  a {
    color: inherit;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--rim);
    font-weight: 550;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece9f0; --soft: #a19fa8; --paper: #131217;
      --glass: rgba(255,255,255,.07); --rim: rgba(255,255,255,.14);
    }
    body { background-image:
      radial-gradient(50rem 30rem at 12% -6%, rgba(120,86,70,.40), transparent 60%),
      radial-gradient(46rem 30rem at 92% 4%, rgba(74,80,132,.42), transparent 60%),
      radial-gradient(40rem 26rem at 60% 22%, rgba(60,98,88,.30), transparent 62%); }
  }
</style>
</head>
<body>
<main>
  <h1>Reprise</h1>
  <div class="links">
    <a href="privacy.html">Privacy</a>
    <a href="support.html">Support</a>
  </div>
</main>
</body>
</html>
